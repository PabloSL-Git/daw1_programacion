<!DOCTYPE html>
<html lang="es-ES">
<head>
<meta charset="utf-8">
<title>Clasificación de triángulo</title>
</head>
<body>
<h1 style="text-align: center">Clasificación de triángulo</h1>

<h2 id="resultado" style="text-align: center;">Calculo</h2>

<script>
// Pedimos los tres lados
let lado1 = parseFloat(prompt("Introduce el primer lado:"));
let lado2 = parseFloat(prompt("Introduce el segundo lado:"));
let lado3 = parseFloat(prompt("Introduce el tercer lado:"));

// Clasificación del triángulo
if (lado1 === lado2 && lado2 === lado3) {
    tipo = "Equilátero";
} else if (lado1 === lado2 || lado1 === lado3 || lado2 === lado3) {
    tipo = "Isósceles";
} else {
    tipo = "Escaleno";
}

// Mostrar resultado
console.log(tipo);
document.getElementById("resultado").textContent = tipo;
</script>

</body>
</html>
