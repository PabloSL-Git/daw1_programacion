<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Login</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#eee;
}

.caja{
    width:400px;
    margin:100px auto;
    background:white;
    padding:40px;
}

h1{
    margin-bottom:30px;
}

input{
    width:100%;
    padding:10px;
    margin-bottom:20px;
    border:none;
    border-bottom:1px solid #ccc;
}

button{
    background:black;
    color:white;
    border:none;
    padding:15px;
    width:200px;
    border-radius:25px;
}

a{
    font-size:14px;
    text-decoration:none;
    color:black;
}

</style>
</head>

<body>

<div class="caja">

<h1>Iniciar sesión</h1>

<form>

<label for="email">Email</label>
<input type="email" id="email">

<label for="password">Contraseña</label>
<input type="password" id="password">

<a href="#">Recuperar contraseña</a>

<br><br>

<button>Iniciar sesión</button>

</form>

</div>

</body>
</html>
