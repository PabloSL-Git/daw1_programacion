<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Zapatillas</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin: 20px;
}

h1{
    margin-bottom: 5px;
}

.menu{
    margin-bottom: 20px;
}

.productos{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

.producto{
    border: 1px solid #ddd;
    padding: 10px;
}

.precio{
    font-weight: bold;
}
</style>

</head>
<body>

<h1>ZAPATILLAS DE HOMBRE</h1>
<p>El diseño de las zapatillas de hombre te permitirá mostrar un estilo propio.</p>

<div class="menu">
    <span>Zapatillas</span>
    <span>Gimnasio</span>
    <span>Fútbol</span>
    <span>Running</span>
</div>

<div class="productos">

    <div class="producto">
        <div class="imagen">
           <img src="Fotos/ZapatoAdidas1.jpeg" alt="Zapato Adidas 1" width="100%">
        </div>
        <div class="precio">110 €</div>
        <div>Zapatilla Handball Spezial</div>
        <div>12 colores</div>
    </div>

    <div class="producto">
        <div class="imagen">
            <img src="Fotos/ZapatoAdidas2.jpeg" alt="Zapato Adidas 2" width="100%">
        </div>
        <div class="precio">120 €</div>
        <div>Zapatilla Gazelle Indoor</div>
        <div>12 colores</div>
    </div>

</div>

</body>
</html>
