<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Presupuesto Ventanas - Instalaciones Faelo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <main class="container py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h1 class="h3 mb-3">Calculadora de ventanas</h1>
                        <p class="text-muted">
                            Precio base: <strong>300 € / m2</strong>
                        </p>
                        <form class="vstack gap-3">
                            <!-- Medidas -->
                            <div class="row">
                                <div class="col">

                                    <label class="form-label">Ancho
                                        (metros)</label>
                                    <input type="number" id="ancho" class="form-control" step="0.01" min="0">
                                </div>

                                <div class="col">

                                    <label class="form-label">Alto
                                        (metros)</label>
                                    <input type="number" id="alto" class="form-control" step="0.01" min="0">
                                </div>
                            </div>
                            <!-- Material -->
                            <div>
                                <label class="form-label">Material</label>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="material" id="aluminio" checked>
                                    <label class="form-check-label">Aluminio</label>
                                </div>

                                <div class="form-check">

                                    <input class="form-check-input" type="radio" name="material" id="pvc">
                                    <label class="form-check-label">PVC
                                        (+15%)</label>
                                </div>
                            </div>
                            <!-- Manijas -->
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="manijas">
                                <label class="form-check-label">
                                    Manijas Ultimate (+220 €)
                                </label>
                            </div>
                            <!-- Botones -->

                            <div class="d-flex gap-2">
                                <button type="button" id="btnCalcular" class="btn btn-primary">Calcular</button>
                                <button type="reset" class="btn btn-outline-secondary">Limpiar</button>
                            </div>
                        </form>
                        <hr class="my-4">
                        <!-- Resultado -->
                        <h2 class="h5">Resultado</h2>
                        <div class="alert alert-info">
                            Total: <strong id="total">0 €</strong>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script>
        const PRECIO_M2 = 300;
        const EXTRA_PVC = 0.15;
        const MANIJAS_ULTIMATE = 220;
        btnCalcular.addEventListener("click", calcular);
        function calcular() {
            let ancho = parseFloat(document.getElementById("ancho").value);
            let alto = parseFloat(document.getElementById("alto").value);
            if (isNaN(ancho) || isNaN(alto)) {
                alert("Introduce ancho y alto correctamente");
                return;
            }
            let metrosCuadrados = ancho * alto;
            let total = metrosCuadrados * PRECIO_M2;

            // PVC
            if (document.getElementById("pvc").checked) {
                total += total * EXTRA_PVC;
            }
            // Manijas
            if (document.getElementById("manijas").checked) {
                total += MANIJAS_ULTIMATE;
            }
            document.getElementById("total").innerHTML = total.toFixed(2) + "€";
        }
    </script>
</body>

</html>
