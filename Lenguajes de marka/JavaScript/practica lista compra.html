<!DOCTYPE html>
<html lang="es">
<body>
    <h1>Lista de la compra</h1>

    <div>
        <label>Aniadir producto:</label>
        <input type="text" id="nombreProducto" placeholder="Ej: Leche">
        <button type="button" id="btnAnadir">Añadir</button>
    </div>

    <div>
        <label>Borrar producto:</label>
        <input type="text" id="borrarProducto" placeholder="Nombre exacto">
        <button type="button" id="btnBorrar">Borrar</button>
    </div>

    <div id="listaProductos"></div>

    <script>
        
	function añadir() {

    let nombre = document.getElementById("nombreProducto").value;
    let boton = document.createElement("button");

    boton.textContent = nombre;
    boton.id = nombre;

    boton.addEventListener("click", function() { boton.remove(); });

    document.getElementById("listaProductos").appendChild(boton);
}

function borrar() {

    let nombre = document.getElementById("borrarProducto").value;

    let obj = document.getElementById(nombre);
    obj.remove();
}

document.getElementById("btnAnadir").addEventListener("click", añadir);
document.getElementById("btnBorrar").addEventListener("click", borrar);

    </script>
</body>
</html>
